<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>笑脸</title>
    <style>
        .face {
            width: 200px;
            height: 200px;
            background-color: #FFD700;
            border-radius: 50%;
            position: relative;
            margin: 50px auto;
        }
        
        .eye {
            width: 30px;
            height: 30px;
            background-color: #000;
            border-radius: 50%;
            position: absolute;
            top: 50px;
        }
        
        .eye.left {
            left: 50px;
        }
        
        .eye.right {
            right: 50px;
        }
        
        .mouth {
            width: 100px;
            height: 50px;
            border-bottom: 5px solid #000;
            border-radius: 0 0 50px 50px;
            position: absolute;
            bottom: 40px;
            left: 50px;
        }
    </style>
</head>
<body>
    <div class="face">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth"></div>
    </div>
</body>
</html>
